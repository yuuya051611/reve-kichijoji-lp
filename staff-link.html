<!DOCTYPE html>
<html lang="ja">
<head>

<title>〇〇 〇〇（仮）｜SALON VILLAGE 吉祥寺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg: #FFFAF6; --bg-alt: #FFF0EC; --card: #FFFFFF; --ink: #3D2B2A; --ink-soft: #8A716E;
    --accent: #FF6F91; --accent2: #FFB347; --accent-deep: #E14C74; --line: #FFE1E4; --dark: #3D2233;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Noto Sans JP', sans-serif; background:var(--bg); color:var(--ink); line-height:1.8; letter-spacing:0.02em;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:64px 20px 40px;
    background: radial-gradient(ellipse at 15% 10%, rgba(255,111,145,0.16), transparent 50%), radial-gradient(ellipse at 85% 20%, rgba(255,179,71,0.14), transparent 45%), var(--bg);
  }
  h1,h2,h3,.serif{ font-family:'Shippori Mincho', serif; }
  .en{ font-family:'Cormorant Garamond', serif; font-style:italic; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ width:100%; max-width:420px; text-align:center; }
  .logo{ font-size:12px; letter-spacing:.2em; color:var(--accent-deep); text-transform:uppercase; margin-bottom:36px; }
  .avatar{ width:132px; height:132px; border-radius:50%; margin:0 auto 22px; position:relative;
    background:conic-gradient(from 210deg, #FFDCE4, #FF9EB0, #E14C74, #FFDCE4); display:flex; align-items:center; justify-content:center; }
  .avatar::before{ content:""; position:absolute; inset:6px; border-radius:50%; background:var(--bg-alt); }
  .avatar span{ position:relative; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:44px; color:var(--accent-deep); }
  .role{ font-size:11px; letter-spacing:.2em; color:var(--accent-deep); text-transform:uppercase; margin-bottom:8px; }
  .name{ font-size:22px; margin-bottom:10px; }
  .bio{ font-size:13.5px; color:var(--ink-soft); margin-bottom:36px; }
  .links{ display:flex; flex-direction:column; gap:14px; }
  .link-btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px 20px;
    border-radius:999px; background:var(--card); border:1.5px solid var(--line); font-size:14px; letter-spacing:.04em;
    box-shadow:0 8px 20px -12px rgba(225,76,116,.25); transition:transform .25s ease, box-shadow .25s ease, background .25s ease, color .25s ease; }
  .link-btn:hover{ transform:translateY(-3px); box-shadow:0 14px 26px -12px rgba(225,76,116,.35); }
  .link-btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .link-btn.primary:hover{ background:var(--accent-deep); }
  .link-btn svg{ width:18px; height:18px; flex-shrink:0; }
  .placeholder-note{ margin-top:8px; font-size:10.5px; color:var(--ink-soft); opacity:.85; }
  .back{ display:inline-block; margin-top:40px; font-size:12px; color:var(--ink-soft); border-bottom:1px solid var(--ink-soft); padding-bottom:2px; }
  .back:hover{ color:var(--accent-deep); border-color:var(--accent-deep); }
</style>
</head>
